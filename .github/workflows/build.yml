name: build-squidex-alias-limit
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mine
      - uses: actions/checkout@v4
        with:
          repository: Squidex/squidex
          ref: 223687424482a619acc2c98195fe1fb4295c6a22
          path: squidex
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply patch
        working-directory: squidex
        run: git apply ../mine/squidex-alias-limit.patch
      - name: Publish (Windows x64, framework-dependent)
        working-directory: squidex/backend
        run: dotnet publish src/Squidex/Squidex.csproj -c Release -r win-x64 --self-contained false -p:version=7.21.0 -o ../../out
      - name: Show result
        run: ls -l out/Squidex.dll out/Squidex.exe out/Squidex.Domain.Apps.Entities.dll out/Squidex.Extensions.dll
      - uses: actions/upload-artifact@v4
        with:
          name: squidex-backend
          path: |
            out/**
            !out/appsettings*.json
            !out/web.config
            !out/wwwroot/**
